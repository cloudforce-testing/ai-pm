<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 導入專案管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17201E; --muted:#5A6764; --line:#D3DBD8;
  --accent:#1E5E52; --accent-ink:#FFFFFF; --accent-soft:#D8EAE4;
  --warn:#9A5B00; --warn-soft:#FAEBD0; --danger:#A3322A; --danger-soft:#F7DEDB;
  --s1:#B8DDD2;--s2:#96CBBC;--s3:#72B7A5;--s4:#4FA08B;--s5:#348873;--s6:#237060;--s7:#17574A;--sa:#17201E;--sb:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --surface:#19211F; --sunk:#0D1210; --ink:#E3EBE8; --muted:#94A39F; --line:#2B3633;
    --accent:#6BC2AC; --accent-ink:#0D1A16; --accent-soft:#1D3530;
    --warn:#E8A94E; --warn-soft:#352914; --danger:#F08A80; --danger-soft:#3A1E1B;
    --s1:#24453D;--s2:#2C5A4F;--s3:#367062;--s4:#418876;--s5:#52A08C;--s6:#67B7A2;--s7:#82CDB9;--sa:#E3EBE8;--sb:#0D1A16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --sunk:#0D1210; --ink:#E3EBE8; --muted:#94A39F; --line:#2B3633;
  --accent:#6BC2AC; --accent-ink:#0D1A16; --accent-soft:#1D3530;
  --warn:#E8A94E; --warn-soft:#352914; --danger:#F08A80; --danger-soft:#3A1E1B;
  --s1:#24453D;--s2:#2C5A4F;--s3:#367062;--s4:#418876;--s5:#52A08C;--s6:#67B7A2;--s7:#82CDB9;--sa:#E3EBE8;--sb:#0D1A16;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 48px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
h1{font-size:1.6rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.seg{position:relative;border:0;background:transparent;text-align:left;padding:12px 14px 12px 18px;border-right:1px solid var(--line);min-width:0}
.seg:last-child{border-right:0}
.seg::after{content:"";position:absolute;right:-6px;top:50%;width:10px;height:10px;background:var(--surface);border:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.seg:last-child::after{display:none}
.seg .n{display:block;font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.seg .l{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.zero .n{color:var(--line)}
.seg:hover{background:var(--sunk)}
.seg.alert .n{color:var(--warn)}
@media (max-width:720px){
  .rail{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seg:nth-child(4){border-right:0}
  .seg:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .seg::after{display:none}
  .seg .n{font-size:1.4rem}
}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.notice{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.err{background:var(--danger-soft)}
.notice button{margin-left:8px}

.board{overflow-x:auto;padding-bottom:8px}
.cols{display:grid;grid-template-columns:repeat(7,minmax(230px,1fr));gap:10px;min-width:max-content}
.col{background:var(--sunk);border-radius:10px;padding:10px;min-height:120px}
.col h3{font-size:.92rem;margin:2px 4px 10px;display:flex;justify-content:space-between;font-weight:700}
.col h3 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;line-height:1.35;margin-bottom:4px}
.card .m{font-size:.8rem;color:var(--muted)}
.card .nx{font-size:.84rem;margin-top:6px}
.card .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--accent-soft);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.meter{flex:1;min-width:60px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.empty-col{font-size:.82rem;color:var(--muted);padding:6px 4px}
details.parked{margin-top:18px}
details.parked summary{cursor:pointer;color:var(--muted);font-weight:500}
.parked-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center}
.empty p{margin:0 0 14px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:700;background:var(--sunk);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.hint{color:var(--muted);font-size:.85rem}

.report-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.report-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.big{font-size:1.15rem;line-height:1.6;margin:0}
.plain{list-style:none;margin:0;padding:0}
.plain li{padding:6px 0;border-bottom:1px solid var(--line)}
.plain li:last-child{border-bottom:0}
textarea.out{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px;font-size:.85rem;resize:vertical}

/* gantt */
.g-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px;font-size:.9rem}
.g-tools select,.tb-grid input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.gantt{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.g-inner{position:relative}
.g-row{display:flex;border-bottom:1px solid var(--line);min-height:48px;cursor:pointer}
.g-row:last-child{border-bottom:0}
.g-row:hover .g-label{background:var(--sunk)}
.g-label{position:sticky;left:0;z-index:3;width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;font-size:.84rem;line-height:1.4}
.g-label b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label span{color:var(--muted)}
.g-label span.over{color:var(--warn);font-weight:500}
.g-head{min-height:32px;cursor:default;background:var(--sunk)}
.g-head .g-label{background:var(--sunk);font-weight:700}
.g-track{position:relative;flex:none}
.g-month{position:absolute;top:0;bottom:0;padding:6px 0 0 6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.g-line{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none;z-index:1}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--danger);z-index:2;pointer-events:none}
.bar{position:absolute;top:13px;height:22px;border-radius:4px;font-size:.72rem;line-height:22px;padding:0 5px;overflow:hidden;white-space:nowrap;z-index:2}
.bar.s1{background:var(--s1);color:var(--sa)}.bar.s2{background:var(--s2);color:var(--sa)}.bar.s3{background:var(--s3);color:var(--sa)}
.bar.s4{background:var(--s4);color:var(--sb)}.bar.s5{background:var(--s5);color:var(--sb)}.bar.s6{background:var(--s6);color:var(--sb)}.bar.s7{background:var(--s7);color:var(--sb)}
.bar.plan{background:transparent;border:1.5px dashed var(--accent);color:var(--muted);line-height:19px}
.bar.over{background:var(--warn);color:var(--surface)}
.bar.parked{background:var(--line);color:var(--muted)}
.ms{position:absolute;top:17px;width:14px;height:14px;margin-left:-7px;z-index:3}
.ms.due{background:var(--ink);transform:rotate(45deg) scale(.75)}
.ms.launch{border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tb-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 16px;margin:8px 0}
.tb-grid label{font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tb-grid input{width:72px}

/* deck */
.deck-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.deck-layout{grid-template-columns:1fr}}
.deck-cfg{position:sticky;top:12px}
.deck-cfg .f:first-of-type{margin-top:0}
.deck-cfg .actions{margin-top:14px}
.slides{display:grid;gap:18px}
.slide-item{margin:0}
.slide-item figcaption{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.slide-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#fff;color:#17201E;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.slide .tx{position:absolute;display:flex;flex-direction:column;line-height:1.4;white-space:pre-wrap;overflow:hidden;word-break:break-word}
.slide table{position:absolute;border-collapse:collapse;table-layout:fixed}
.slide th,.slide td{border-bottom:1px solid #D3DBD8;padding:0 12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.present{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.present .slide-frame{border:0;border-radius:0;width:auto}
.present .pbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:#ddd;font-size:.85rem;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;opacity:.25;transition:opacity .2s}
.present .pbar:hover,.present .pbar:focus-within{opacity:1}
.present .pbar button{background:transparent;border:1px solid #555;color:#eee;border-radius:6px;padding:3px 10px}

/* agile */
.sp-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-bottom:14px}
@media (max-width:900px){.sp-head{grid-template-columns:1fr}}
.goal{font-size:1.15rem;font-weight:700;margin:6px 0 10px;line-height:1.45}
.stat{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);align-items:baseline}
.stat b{color:var(--ink);font-size:1.35rem;font-variant-numeric:tabular-nums;margin-right:2px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-size:11px;fill:var(--muted)}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;min-width:max-content}
.icard{cursor:pointer}
.icard .ft{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.icard .ft .sp{flex:1}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;font-size:.8rem;line-height:24px;min-width:30px}
.mini:hover{border-color:var(--accent)}
.tag.muted{background:var(--sunk);color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.quick input,.quick select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.quick input.grow{flex:1;min-width:220px}
.blist{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.brow{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .ttl{cursor:pointer;min-width:0}
.brow .ttl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.brow .mv{display:flex;gap:4px}
@media (max-width:640px){.brow{grid-template-columns:28px minmax(0,1fr) auto}.brow .tags{grid-column:2/3;justify-content:flex-start}}
.pick{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.pick label{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:.9rem;cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick label .grow{flex:1;min-width:0}
details.past{border-bottom:1px solid var(--line);padding:8px 0}
details.past:last-child{border-bottom:0}
details.past summary{cursor:pointer;font-weight:500}
details.past dl{display:grid;grid-template-columns:7em minmax(0,1fr);gap:4px 12px;margin:8px 0 0;font-size:.88rem}
details.past dt{color:var(--muted)}
details.past dd{margin:0;white-space:pre-wrap}
.worklist{list-style:none;margin:0;padding:0;font-size:.88rem}
.worklist li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.worklist li span.grow{flex:1;min-width:0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dr-head input{flex:1;font-size:1.25rem;font-weight:700;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent;min-width:0}
.dr-head input:hover,.dr-head input:focus{border-color:var(--line)}
.dr-body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.stage-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.stage-ctl select,.stage-ctl input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.gate{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.gate .q{font-weight:700;margin:0 0 8px}
.gate ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px;font-size:.88rem}
.gate li::before{content:"○ ";color:var(--muted)}
.gate li.ok::before{content:"● ";color:var(--accent)}
.gate .warnbox{margin-top:10px;background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.sec summary{padding:10px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}
details.sec summary span{font-weight:400;color:var(--muted);font-size:.85rem}
details.sec .in{padding:0 14px 14px}
.f{margin-top:10px}
.f label{display:block;font-size:.85rem;font-weight:500;margin-bottom:3px}
.f label small{color:var(--muted);font-weight:400;margin-left:6px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface)}
.f textarea{min-height:72px;resize:vertical}
.f textarea.tall{min-height:140px}
.score{display:flex;gap:4px}
.score button{width:36px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
.score button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.log{list-style:none;padding:0;margin:8px 0 0;font-size:.88rem}
.log li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log li time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.log-add{display:flex;gap:6px;margin-top:8px}
.log-add input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);min-width:0}
.dr-foot{margin-top:24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ro input,.ro textarea,.ro select,.ro .score button{pointer-events:none;opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AI 導入專案</h1>
      <p class="sub" id="sub">載入中</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-new">新增專案</button>
      <button class="btn" data-view="deck">產出簡報</button>
      <button class="btn" id="btn-backup">匯出備份</button>
      <button class="btn" id="btn-restore">匯入備份</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="notices"></div>
  <div class="rail" id="rail" aria-label="各關卡專案數"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="board" aria-selected="true">專案關卡</button>
    <button role="tab" data-view="sprint" aria-selected="false">衝刺</button>
    <button role="tab" data-view="backlog" aria-selected="false">待辦清單</button>
    <button role="tab" data-view="gantt" aria-selected="false">甘特圖</button>
    <button role="tab" data-view="priority" aria-selected="false">優先排序</button>
    <button role="tab" data-view="report" aria-selected="false">月報</button>
    <button role="tab" data-view="deck" aria-selected="false">簡報</button>
    <button role="tab" data-view="guide" aria-selected="false">流程說明</button>
  </nav>

  <main id="main"></main>
</div>
<div id="drawer-root"></div>

<script>
(function(){
"use strict";

/* ================= definitions ================= */
const STAGES = [
  {k:"1 收件", s:"收件", purpose:"所有需求從同一入口進來", gate:"這是「問題」，還是對方已想好的「解法」？", req:["name","unit","owner","current"]},
  {k:"2 探索", s:"探索", purpose:"挖出真正的痛點與現況數字", gate:"能否一句話講清「誰、在什麼情況、遇到什麼困難、造成什麼損失」？", req:["problem","freq","mins","people"]},
  {k:"3 評估排序", s:"評估排序", purpose:"用同一把尺決定先做什麼", gate:"在所有待辦裡，這件事值得現在做嗎？", req:["sImpact","sFeas","sFit","sCommit","sRisk"]},
  {k:"4 驗證", s:"驗證", purpose:"用最便宜的方式確認方向", gate:"使用者試用後覺得有幫助？測試案例的品質達標？", req:["success","tests"]},
  {k:"5 建置", s:"建置", purpose:"在時間上限內做出可用工具", gate:"測試案例達標？有人能在你不在時處理基本問題？", req:["outScope","due"]},
  {k:"6 上線導入", s:"上線導入", purpose:"讓人真的開始用", gate:"大家真的在用嗎？沒在用的原因是什麼？", req:["launch","maint","usage"]},
  {k:"7 營運檢討", s:"營運檢討", purpose:"對照基準值算出效益", gate:"維護成本對得起它帶來的價值嗎？", req:["minsAfter"]}
];
const PARKED = ["暫停","退場"];
const ALL_STAGES = STAGES.map(s=>s.k).concat(PARKED);

const FIELDS = [
  {k:"name",h:"專案名稱",t:"text",s:0},
  {k:"stage",h:"關卡",t:"stage",s:0},
  {k:"unit",h:"提案單位",t:"text",s:1,hint:"例如：業務部"},
  {k:"owner",h:"提案人",t:"text",s:1},
  {k:"start",h:"開始日",t:"date",s:1,hint:"甘特圖從這天開始畫"},
  {k:"current",h:"現況做法",t:"long",s:1,hint:"現在怎麼做、用什麼工具"},
  {k:"problem",h:"問題陳述",t:"long",s:2,hint:"誰／什麼情況／什麼困難／什麼損失"},
  {k:"freq",h:"每月發生次數",t:"num",s:2,hint:"全單位合計"},
  {k:"mins",h:"每次耗時分鐘",t:"num",s:2,hint:"導入前"},
  {k:"people",h:"影響人數",t:"num",s:2},
  {k:"interview",h:"訪談紀錄",t:"long",s:2,tall:true,hint:"上次遇到是什麼時候？怎麼處理？最花時間的是哪一步？"},
  {k:"sImpact",h:"影響分",t:"score",s:3,hint:"範圍越大、痛越深越高"},
  {k:"sFeas",h:"可行性分",t:"score",s:3,hint:"資料拿得到、技術做得到越高"},
  {k:"sFit",h:"AI適配分",t:"score",s:3,hint:"規則或自動化就能解決則給低分"},
  {k:"sCommit",h:"投入度分",t:"score",s:3,hint:"提案人願意一起測試、推動越高"},
  {k:"sRisk",h:"風險分",t:"score",s:3,hint:"5 = 風險最高"},
  {k:"success",h:"成功標準",t:"long",s:4,hint:"上線後怎樣算成功，含數字"},
  {k:"tests",h:"測試案例",t:"long",s:4,tall:true,hint:"一行一個：輸入 → 期望結果 → 是否通過"},
  {k:"outScope",h:"範圍外",t:"long",s:5,hint:"這次明確不做的事"},
  {k:"due",h:"預計交付日",t:"date",s:5},
  {k:"launch",h:"上線日",t:"date",s:6},
  {k:"maint",h:"維護負責人",t:"text",s:6,hint:"單位內的窗口"},
  {k:"usage",h:"每月使用次數",t:"num",s:6},
  {k:"followup",h:"回訪紀錄",t:"long",s:6,tall:true,hint:"兩週與一個月回訪：怎麼用、卡在哪"},
  {k:"minsAfter",h:"導入後每次耗時分鐘",t:"num",s:7},
  {k:"next",h:"下一步",t:"text",s:0},
  {k:"decisions",h:"決策紀錄",t:"log",s:0}
];
const F = Object.fromEntries(FIELDS.map(f=>[f.k,f]));
const STALE_DAYS = 14;
const DEFAULT_TB = [7,14,7,14,28,30,30];

/* ================= state ================= */
let projects = new Map();
let TB = DEFAULT_TB.slice(), WIP = 2;
let deckCfg = {title:"AI 導入進度報告", audience:"", detail:"validated", asks:""};
let view = "board", openId = null, pendingAdvance = null, confirmDelete = false;
let gRange = "1-3", gShowParked = false, gSettings = false;
let reportMonth;
let mode = "loading", db = null, col = null, canEdit = true, loaded = false;
let downloadsNS = null;
const timers = {}, chains = {};
const ITYPES=["使用者故事","任務","探索","問題"];
const ISTAT=["待辦","進行中","待驗收","完成"];
const PTS=[1,2,3,5,8,13];
const ITEM_KEYS=["title","projectId","type","asA","iWant","soThat","ac","points","status","sprintId","rank","notes","doneAt","createdAt","updatedAt"];
const SPRINT_KEYS=["no","name","start","end","goal","status","review","keep","problem","try","committedPoints","completedPoints","closedAt","createdAt","updatedAt"];
let items=new Map(), sprints=new Map();
let SPRINT_LEN=14, ITEM_WIP=3;
let openItem=null, confirmItemDelete=false;
let planDraft=null, closing=false, closeDraft={review:"",keep:"",problem:"",try:""};
let blFilter="all", blShowDone=false;
const COLX={}; const LSX={items:"ai-pm-items-v1",sprints:"ai-pm-sprints-v1"};
const LS_KEY="ai-pm-projects-v1", LS_SET="ai-pm-settings-v1", LS_DECK="ai-pm-deck-v1";

/* ================= helpers ================= */
const $ = s=>document.querySelector(s);
const esc = v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty = v=>v===undefined||v===null||v===""||(Array.isArray(v)&&v.length===0);
const num = v=>{ if(empty(v)) return ""; const n=parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?"":n; };
const r1 = n=>Math.round(n*10)/10;
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = ()=>ymd(new Date());
reportMonth = today().slice(0,7);
const stageIdx = k=>STAGES.findIndex(s=>s.k===k);
const DAY=86400000;
const dnum = s=>Math.round(Date.parse(s+"T00:00:00Z")/DAY);
const dstr = n=>new Date(n*DAY).toISOString().slice(0,10);
const span = (s,e)=>dstr(s)+" 至 "+dstr(e-1)+"（"+(e-s)+" 天）";
const nm = p=>p.name||"未命名專案";
const cut = (s,n)=>{ s=String(s||""); return s.length>n?s.slice(0,n-1)+"…":s; };

function score(p){
  const ks=["sImpact","sFeas","sFit","sCommit","sRisk"];
  if(ks.some(k=>empty(p[k]))) return null;
  return p.sImpact*2+p.sFeas+p.sFit+p.sCommit+(6-p.sRisk);
}
function baseHours(p){ return (!empty(p.freq)&&!empty(p.mins)) ? r1(p.freq*p.mins/60) : null; }
function saved(p){ return (!empty(p.freq)&&!empty(p.mins)&&!empty(p.minsAfter)) ? r1(p.freq*(p.mins-p.minsAfter)/60) : null; }
function gateStatus(p){
  const i=stageIdx(p.stage); if(i<0) return null;
  const req=STAGES[i].req; return {req,done:req.filter(k=>!empty(p[k])),missing:req.filter(k=>empty(p[k]))};
}
function daysSince(iso){ if(!iso) return 0; const t=Date.parse(iso); return isNaN(t)?0:Math.floor((Date.now()-t)/DAY); }
function history(p){
  const start=p.start||(p.createdAt?ymd(new Date(p.createdAt)):today());
  const moves=[];
  (p.decisions||[]).forEach(e=>{ const m=String(e.t||"").match(/從「(.+?)」移到「(.+?)」/); if(m&&e.d) moves.push({d:e.d,from:m[1],to:m[2]}); });
  moves.sort((a,b)=>a.d.localeCompare(b.d));
  const first=moves.length?(ALL_STAGES.includes(moves[0].from)?moves[0].from:STAGES[0].k):p.stage;
  const h=[{stage:first,d:start}];
  moves.forEach(m=>{ if(!ALL_STAGES.includes(m.to)) return; const last=h[h.length-1].d; h.push({stage:m.to,d:m.d<last?last:m.d}); });
  if(h[h.length-1].stage!==p.stage){ const last=h[h.length-1].d; const u=p.updatedAt?ymd(new Date(p.updatedAt)):today(); h.push({stage:p.stage,d:u<last?last:u}); }
  return h;
}
function stageClock(p){
  const i=stageIdx(p.stage); if(i<0) return null;
  const h=history(p), entry=h[h.length-1].d, t=dnum(today());
  const days=Math.max(0,t-dnum(entry));
  if(i===6) return {i,entry,days,box:TB[6],pe:null,endStr:"",over:0};
  const useDue=i===4&&p.due;
  const pe=useDue?dnum(p.due)+1:dnum(entry)+TB[i];
  return {i,entry,days,box:useDue?Math.max(1,pe-dnum(entry)):TB[i],pe,endStr:dstr(pe-1),over:Math.max(0,t+1-pe)};
}
function isStale(p){ const i=stageIdx(p.stage); return i>=0 && i<=5 && daysSince(p.updatedAt)>=STALE_DAYS; }
function isOver(p){ const c=stageClock(p); return !!(c&&c.over>0); }
function ganttSegments(p,t){
  const h=history(p), ck=stageClock(p), out=[];
  h.forEach((e,k)=>{
    const s=dnum(e.d), last=k===h.length-1, si=stageIdx(e.stage), lab=si<0?e.stage:STAGES[si].s;
    if(!last){ const e2=dnum(h[k+1].d); out.push({s,e:e2,k:si<0?"parked":"s"+(si+1),label:lab,title:e.stage+"："+span(s,e2)}); return; }
    if(si<0){ out.push({s,e:t+1,k:"parked",label:lab,title:e.stage+"：自 "+e.d}); return; }
    if(si===6){ out.push({s,e:t+1,k:"s7",label:lab,title:e.stage+"：自 "+e.d}); return; }
    const pe=ck.pe;
    if(t+1>pe){ out.push({s,e:pe,k:"s"+(si+1),label:lab,title:e.stage+"：時間盒 "+span(s,pe)}); out.push({s:pe,e:t+1,k:"over",label:"超過 "+ck.over+" 天",title:"超過時間盒 "+ck.over+" 天"}); }
    else { out.push({s,e:t+1,k:"s"+(si+1),label:lab,title:e.stage+"：自 "+e.d}); out.push({s:t+1,e:pe,k:"plan",label:"",title:"本關時間盒到 "+ck.endStr}); }
    let cur=Math.max(pe,t+1);
    for(let j=si+1;j<=5;j++){
      const e2=(j===4&&p.due&&dnum(p.due)+1>cur)?dnum(p.due)+1:cur+TB[j];
      out.push({s:cur,e:e2,k:"plan",label:STAGES[j].s,title:"預估 "+STAGES[j].k+"："+span(cur,e2)}); cur=e2;
    }
  });
  return out;
}
function sorted(list){
  return list.sort((a,b)=>{
    const sa=score(a)??-1, sb=score(b)??-1;
    if(sb!==sa) return sb-sa;
    return (b.updatedAt||"").localeCompare(a.updatedAt||"");
  });
}
function byStage(list){ return list.sort((p,q)=>{ const a=stageIdx(p.stage), b=stageIdx(q.stage); return ((a<0?99:a)-(b<0?99:b))||nm(p).localeCompare(nm(q)); }); }

/* ================= storage ================= */
function clean(p){ const o={}; for(const f of FIELDS){ if(!empty(p[f.k])) o[f.k]=p[f.k]; } o.updatedAt=p.updatedAt||new Date().toISOString(); o.createdAt=p.createdAt||o.updatedAt; return o; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function saveLocal(){ if(!lsSet(LS_KEY,[...projects.values()])) notice("瀏覽器無法儲存資料，請立即匯出備份。","err"); }
function newId(){ return col ? col.doc().id : "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function writeNow(p){
  if(mode==="api") return apiReq("PUT","projects",p.id,clean(p));
  if(mode==="db"){
    const id=p.id, body=clean(p);
    chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).set(body)).catch(e=>{
      if(e&&e.code==="invalid_argument"){ canEdit=false; renderAll(); notice("你目前只有檢視權限，變更沒有被儲存。","warn"); }
      else notice("儲存失敗（"+(e&&e.code||"未知錯誤")+"），請稍後再改一次。","err");
    });
    return chains[id];
  }
  saveLocal(); return Promise.resolve();
}
function persist(p,immediate){
  p.updatedAt=new Date().toISOString();
  projects.set(p.id,p);
  renderShell();
  clearTimeout(timers[p.id]);
  if(immediate){ delete timers[p.id]; return writeNow(p); }
  timers[p.id]=setTimeout(()=>{ delete timers[p.id]; writeNow(projects.get(p.id)); },500);
}
function removeProject(id){
  projects.delete(id); clearTimeout(timers[id]); delete timers[id];
  if(mode==="api") apiReq("DELETE","projects",id);
  else if(mode==="db") (chains[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(()=>notice("刪除失敗，請重新整理後再試。","err"));
  else saveLocal();
}
let lastApiWrite=0, apiTimer=null;
function apiReq(method,coll,id,body){
  const key=coll+":"+id+":api"; lastApiWrite=Date.now();
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    const r=await fetch("/api/doc/"+encodeURIComponent(coll)+"/"+encodeURIComponent(id),{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined,credentials:"same-origin",cache:"no-store"});
    lastApiWrite=Date.now();
    if(r.status===401||r.status===403){ notice("伺服器拒絕這次儲存：登入可能已過期。請重新整理頁面、重新登入後再改一次。","err"); return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
  }).catch(e=>notice("儲存失敗（"+(e&&e.message||"網路錯誤")+"）。若持續發生，請重新整理頁面重新登入。","err"));
  return chains[key];
}
function mergeApi(d){
  const mk=(arr,c,cur)=>{ const next=new Map(); const tk=id=>c==="projects"?id:c+":"+id;
    (Array.isArray(arr)?arr:[]).forEach(o=>{ if(!o||!o.id) return; const local=cur.get(o.id); next.set(o.id,timers[tk(o.id)]&&local?local:o); });
    cur.forEach((o,id)=>{ if(!next.has(id)&&timers[tk(id)]) next.set(id,o); }); return next; };
  projects=mk(d.projects,"projects",projects); items=mk(d.items,"items",items); sprints=mk(d.sprints,"sprints",sprints);
  if(d.settings&&d.settings.timebox) applySettings(d.settings.timebox);
  if(d.settings&&d.settings.deck&&!document.querySelector(".deck-cfg :focus")) Object.assign(deckCfg,d.settings.deck);
}
async function apiPull(){
  if(mode!=="api"||document.hidden||Date.now()-lastApiWrite<5000||Object.keys(timers).length) return;
  try{
    const r=await fetch("/api/data",{cache:"no-store",credentials:"same-origin",headers:{accept:"application/json"}});
    if(!r.ok||!(r.headers.get("content-type")||"").includes("application/json")) return;
    const d=await r.json(); if(Date.now()-lastApiWrite<5000) return;
    mergeApi(d);
    if(document.querySelector("#main input:focus,#main textarea:focus,#main select:focus")){ renderSub(); renderRail(); } else renderShell();
    if(openItem&&!items.has(openItem)){ openItem=null; renderDrawer(); }
    else if(openId&&!projects.has(openId)){ openId=null; renderDrawer(); }
    else if((openItem||openId)&&!document.querySelector(".drawer :focus")) renderDrawer();
  }catch(e){}
}
const MAPX=c=>c==="items"?items:sprints;
const allX=c=>[...MAPX(c).values()];
function cleanX(c,o){ const keys=c==="items"?ITEM_KEYS:SPRINT_KEYS, r={}; keys.forEach(k=>{ if(!empty(o[k])) r[k]=o[k]; }); return r; }
function newIdX(c){ return COLX[c]?COLX[c].doc().id:c[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function writeX(c,o){
  if(mode==="api") return apiReq("PUT",c,o.id,cleanX(c,o));
  if(mode==="db"){
    const key=c+":"+o.id, body=cleanX(c,o);
    chains[key]=(chains[key]||Promise.resolve()).then(()=>COLX[c].doc(o.id).set(body)).catch(e=>{
      if(e&&e.code==="invalid_argument"){ canEdit=false; renderAll(); notice("你目前只有檢視權限，變更沒有被儲存。","warn"); }
      else notice("儲存失敗（"+(e&&e.code||"未知錯誤")+"），請稍後再改一次。","err");
    });
    return chains[key];
  }
  if(!lsSet(LSX[c],allX(c))) notice("瀏覽器無法儲存資料，請立即匯出備份。","err");
  return Promise.resolve();
}
function persistX(c,o,immediate){
  o.updatedAt=new Date().toISOString(); MAPX(c).set(o.id,o);
  const key=c+":"+o.id; clearTimeout(timers[key]);
  if(immediate){ delete timers[key]; writeX(c,o); }
  else timers[key]=setTimeout(()=>{ delete timers[key]; const cur=MAPX(c).get(o.id); cur&&writeX(c,cur); },500);
}
function removeX(c,id){
  MAPX(c).delete(id); const key=c+":"+id; clearTimeout(timers[key]); delete timers[key];
  if(mode==="api") apiReq("DELETE",c,id);
  else if(mode==="db") (chains[key]||Promise.resolve()).then(()=>COLX[c].doc(id).delete()).catch(()=>notice("刪除失敗，請重新整理後再試。","err"));
  else lsSet(LSX[c],allX(c));
}
function isReady(it){ return !empty(it.title)&&!empty(it.points)&&(it.type!=="使用者故事"||!empty(it.ac)); }
function activeSprint(){ return allX("sprints").find(s=>s.status==="active")||null; }
function closedSprints(){ return allX("sprints").filter(s=>s.status==="closed").sort((a,b)=>(a.no||0)-(b.no||0)); }
function nextSprintNo(){ return allX("sprints").reduce((m,s)=>Math.max(m,+s.no||0),0)+1; }
function sprintItems(sp){ return allX("items").filter(i=>i.sprintId===sp.id); }
function ptsOf(list){ return list.reduce((a,i)=>a+(+i.points||0),0); }
function avgVelocity(){ const c=closedSprints().slice(-3); return c.length?Math.round(c.reduce((a,s)=>a+(+s.completedPoints||0),0)/c.length):null; }
function backlogItems(){ return allX("items").filter(i=>!i.sprintId&&i.status!=="完成").sort((a,b)=>(a.rank||0)-(b.rank||0)); }
function projName(id){ const p=id&&projects.get(id); return p?nm(p):""; }
function minRank(){ const b=allX("items"); return b.length?Math.min(...b.map(i=>+i.rank||0)):0; }
function maxRank(){ const b=allX("items"); return b.length?Math.max(...b.map(i=>+i.rank||0)):0; }
function sprintDay(sp){ const L=dnum(sp.end)-dnum(sp.start)+1; const d=Math.min(L,Math.max(1,dnum(today())-dnum(sp.start)+1)); return {d,L,left:Math.max(0,dnum(sp.end)-dnum(today()))}; }
const md=s=>{ const a=String(s||"").split("-"); return a.length===3?(+a[1])+"/"+(+a[2]):s; };
function applySettings(o){
  if(o&&Array.isArray(o.days)&&o.days.length===7) TB=o.days.map((v,i)=>+v>0?+v:DEFAULT_TB[i]);
  if(o&&+o.wip>0) WIP=+o.wip;
  if(o&&+o.sprintLen>0) SPRINT_LEN=+o.sprintLen;
  if(o&&+o.itemWip>0) ITEM_WIP=+o.itemWip;
}
function saveSettings(){
  const body={days:TB,wip:WIP,sprintLen:SPRINT_LEN,itemWip:ITEM_WIP};
  if(mode==="api") apiReq("PUT","settings","timebox",body);
  else if(mode==="db") db.doc("settings/timebox").set(body).catch(()=>notice("時間盒設定儲存失敗。","err"));
  else lsSet(LS_SET,body);
}
let deckTimer;
function saveDeckCfg(){
  clearTimeout(deckTimer);
  deckTimer=setTimeout(()=>{
    if(mode==="api") apiReq("PUT","settings","deck",Object.assign({},deckCfg));
    else if(mode==="db") db.doc("settings/deck").set(Object.assign({},deckCfg)).catch(()=>{});
    else lsSet(LS_DECK,deckCfg);
  },500);
}

/* ================= notices ================= */
let noticeTimer;
function notice(msg,kind){
  $("#notices").innerHTML='<div class="notice '+(kind||"")+'" role="status">'+esc(msg)+'<button class="btn ghost" data-act="dismiss">關閉</button></div>';
  clearTimeout(noticeTimer);
  if(!kind) noticeTimer=setTimeout(()=>{ $("#notices").innerHTML=""; },8000);
}

/* ================= shell ================= */
function renderShell(){ renderSub(); renderRail(); renderMain(); }
function renderAll(){ renderShell(); renderDrawer(); }
function renderSub(){
  const all=[...projects.values()];
  const active=all.filter(p=>stageIdx(p.stage)>=0).length;
  const flagged=all.filter(p=>isStale(p)||isOver(p)).length;
  const where = mode==="api"&&!canEdit ? "尚未登入或伺服器設定未完成" : mode==="db"||mode==="api" ? "資料已儲存" : mode==="local" ? "資料存在這個瀏覽器，請定期匯出備份" : "";
  const sp=activeSprint(); const spTxt=sp?"第 "+sp.no+" 次衝刺進行中，剩 "+sprintDay(sp).left+" 天。":"";

function boardHTML(all){

/* ================= gantt ================= */
function ganttHTML(all){
  const [b,a]=gRange.split("-").map(Number);
  const now=new Date(), t=dnum(today());
  const from=dnum(ymd(new Date(now.getFullYear(),now.getMonth()-b,1)));
  const to=dnum(ymd(new Date(now.getFullYear(),now.getMonth()+a+1,0)));
  const days=to-from+1, ppd=Math.max(3,Math.min(12,Math.floor(1100/days))), W=days*ppd, LW=220;
  const X=d=>(Math.max(from,Math.min(to+1,d))-from)*ppd;
  const n5=all.filter(p=>p.stage===STAGES[4].k).length;
  let out='<div class="g-tools"><label>範圍 <select id="g-range">'+
    [["1-3","前 1 個月＋後 3 個月"],["3-3","前 3 個月＋後 3 個月"],["6-6","前 6 個月＋後 6 個月"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===gRange?" selected":"")+'>'+o[1]+'</option>').join("")+
    '</select></label><label><input type="checkbox" id="g-parked"'+(gShowParked?" checked":"")+'> 顯示暫停與退場</label>'+
    '<button class="btn" data-act="g-settings" aria-expanded="'+gSettings+'">時間盒設定</button>'+
    (n5>WIP?'<span class="tag warn">建置中 '+n5+' 項，超過同時上限 '+WIP+' 項</span>':'<span class="hint">建置中 '+n5+'／上限 '+WIP+' 項</span>')+'</div>';
  if(gSettings){
    out+='<div class="tb-panel"><b>每關可停留的天數</b><p class="hint" style="margin:2px 0 0">超過就會標示，並提醒你做決定。建置關若有填「預計交付日」，以交付日為準。</p><div class="tb-grid">'+
      STAGES.map((s,i)=>'<label>'+(i+1)+" "+esc(s.s)+' <input type="number" min="1" step="1" data-tb="'+i+'" value="'+TB[i]+'"'+(canEdit?"":" disabled")+'></label>').join("")+
      '<label>建置同時上限 <input type="number" min="1" step="1" id="g-wip" value="'+WIP+'"'+(canEdit?"":" disabled")+'></label></div>'+
      (canEdit?'<button class="btn ghost" data-act="tb-reset">恢復預設值</button>':"")+'</div>';
  }
  const rows=byStage(all.filter(p=>stageIdx(p.stage)>=0||(gShowParked&&PARKED.includes(p.stage))));
  if(!rows.length) return out+'<p class="hint">沒有可顯示的專案。</p>';
  let months="", lines="";
  for(let d=new Date(now.getFullYear(),now.getMonth()-b,1); dnum(ymd(d))<=to; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const x=X(dnum(ymd(d)));
    months+='<span class="g-month" style="left:'+x+'px">'+(d.getMonth()===0||x===0?d.getFullYear()+" 年 ":"")+(d.getMonth()+1)+' 月</span>';
    lines+='<span class="g-line" style="left:'+(LW+x)+'px"></span>';
  }
  const body=rows.map(p=>{
    const ck=stageClock(p);
    const segs=ganttSegments(p,t).map(g=>{ const x1=X(g.s), w=X(g.e)-x1; if(w<=0) return ""; return '<span class="bar '+g.k+'" style="left:'+x1+'px;width:'+w+'px" title="'+esc(g.title)+'">'+(w>36?esc(g.label):"")+'</span>'; }).join("");
    let ms="";
    if(p.due){ const d=dnum(p.due); if(d>=from&&d<=to) ms+='<span class="ms due" style="left:'+(X(d)+ppd/2)+'px" title="預計交付日 '+esc(p.due)+'"></span>'; }
    if(p.launch){ const d=dnum(p.launch); if(d>=from&&d<=to) ms+='<span class="ms launch" style="left:'+(X(d)+ppd/2)+'px" title="上線日 '+esc(p.launch)+'"></span>'; }
    const sub=!ck?esc(p.stage):ck.i===6?esc(p.stage)+"，第 "+(ck.days+1)+" 天":esc(STAGES[ck.i].s)+"，第 "+(ck.days+1)+"／"+ck.box+" 天";
    return '<div class="g-row" data-open="'+esc(p.id)+'"><div class="g-label"><b>'+esc(nm(p))+'</b><span class="'+(ck&&ck.over?"over":"")+'">'+sub+'</span></div><div class="g-track" style="width:'+W+'px">'+segs+ms+'</div></div>';
  }).join("");
  const todayLine=(t>=from&&t<=to)?'<span class="g-today" style="left:'+(LW+X(t)+ppd/2)+'px" title="今天 '+today()+'"></span>':"";
  return out+'<div class="gantt"><div class="g-inner" style="width:'+(LW+W)+'px">'+lines+todayLine+
    '<div class="g-row g-head"><div class="g-label">專案</div><div class="g-track" style="width:'+W+'px">'+months+'</div></div>'+body+'</div></div>'+
    '<div class="legend"><span><i style="background:var(--s3)"></i>已走過或目前所在的關卡</span><span><i style="border:1.5px dashed var(--accent)"></i>依時間盒推估</span><span><i style="background:var(--warn)"></i>超過時間盒</span><span><i style="background:var(--ink);transform:rotate(45deg) scale(.6);width:12px;height:12px"></i>預計交付日</span><span><i style="background:var(--accent);border-radius:50%;width:12px;height:12px"></i>上線日</span><span><i style="background:var(--danger);width:2px"></i>今天</span></div>'+
    '<p class="hint">各關的起訖日來自「決策紀錄」裡的關卡移動紀錄，起點是「開始日」。用專案內頁的按鈕或選單移動關卡，就會自動記錄。</p>';
}

function burnSVG(sp){
  const its=sprintItems(sp), total=ptsOf(its), d0=dnum(sp.start), d1=dnum(sp.end), L=Math.max(1,d1-d0), t=dnum(today());
  const W=640,H=230,pl=40,pr=14,pt=14,pb=30;
  const X=k=>pl+k/L*(W-pl-pr), Y=v=>pt+(total?1-v/total:1)*(H-pt-pb);
  let pts=[]; for(let k=0;k<=Math.min(L,t-d0);k++){ const ds=dstr(d0+k); pts.push(X(k).toFixed(1)+","+Y(total-ptsOf(its.filter(i=>i.status==="完成"&&i.doneAt&&i.doneAt<=ds))).toFixed(1)); }
  const xt=t>=d0&&t<=d1?'<line x1="'+X(t-d0)+'" x2="'+X(t-d0)+'" y1="'+pt+'" y2="'+(H-pb)+'" style="stroke:var(--danger);stroke-width:1.5"/>':"";

    '<line x1="'+X(0)+'" y1="'+Y(total)+'" x2="'+X(L)+'" y2="'+Y(0)+'" style="stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.5"/>'+xt+
    (pts.length?'<polyline points="'+pts.join(" ")+'" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>':"")+
    '<text x="'+(pl-6)+'" y="'+(pt+4)+'" text-anchor="end">'+total+'</text><text x="'+(pl-6)+'" y="'+(H-pb)+'" text-anchor="end">0</text>'+
    '<text x="'+pl+'" y="'+(H-10)+'">'+md(sp.start)+'</text><text x="'+(W-pr)+'" y="'+(H-10)+'" text-anchor="end">'+md(sp.end)+'</text></svg>'+
    '<div class="legend"><span><i style="background:var(--accent);height:3px"></i>實際剩餘點數</span><span><i style="border-top:2px dashed var(--muted);height:0"></i>理想進度</span><span><i style="background:var(--danger);width:2px"></i>今天</span></div>';

function newItem(o){
  const now=new Date().toISOString();
  const it=Object.assign({id:newIdX("items"),title:"",type:"任務",status:"待辦",rank:maxRank()+1,createdAt:now},o);

function setItemStatus(it,st){

function reportData(all){
  const month=reportMonth;
  const live=all.filter(p=>stageIdx(p.stage)>=5);
  return {
    month, live,
    launched:all.filter(p=>(p.launch||"").startsWith(month)),
    updated:all.filter(p=>(p.updatedAt||"").startsWith(month)||(p.decisions||[]).some(e=>(e.d||"").startsWith(month))),
    stale:all.filter(isStale), over:all.filter(isOver),
    totalSaved:r1(live.reduce((a,p)=>a+Math.max(0,saved(p)||0),0)),
    totalUsage:live.reduce((a,p)=>a+(num(p.usage)||0),0),
    dist:STAGES.map(s=>({s:s.s,n:all.filter(p=>p.stage===s.k).length}))
  };
}

/* ================= deck: data → shape list ================= */
const C={ink:"#17201E",muted:"#5A6764",line:"#D3DBD8",accent:"#1E5E52",soft:"#D8EAE4",warn:"#9A5B00",warnSoft:"#FAEBD0",danger:"#A3322A",white:"#FFFFFF"};
const RAMP=["#B8DDD2","#96CBBC","#72B7A5","#4FA08B","#348873","#237060","#17574A"];
const rampInk=i=>i<3?C.ink:C.white;
const T=(x,y,w,h,text,o)=>Object.assign({t:"text",x,y,w,h,text:String(text),size:18,color:C.ink,align:"left",valign:"top"},o||{});
const R=(x,y,w,h,o)=>Object.assign({t:"rect",x,y,w,h},o||{});
const E=(x,y,w,h,o)=>Object.assign({t:"ellipse",x,y,w,h},o||{});
const Ln=(x,y,w,h,o)=>Object.assign({t:"line",x,y,w,h,color:C.line,width:1},o||{});
const titleOf=t=>T(64,40,1152,64,t,{size:38,bold:true,valign:"middle"});

function buildDeck(){
  const all=[...projects.values()];
  const active=byStage(all.filter(p=>stageIdx(p.stage)>=0));
  const live=all.filter(p=>stageIdx(p.stage)>=5);
  const totalSaved=r1(live.reduce((a,p)=>a+Math.max(0,saved(p)||0),0));
  const totalUsage=live.reduce((a,p)=>a+(num(p.usage)||0),0);
  const t=dnum(today()); const [Y,M,D]=today().split("-");
  const slides=[];

  // 1 cover
  slides.push({name:"封面",shapes:[
    R(0,0,1280,720,{fill:C.accent}),
    R(96,214,8,176,{fill:"#96CBBC"}),
    T(128,200,1060,130,deckCfg.title||"AI 導入進度報告",{size:60,bold:true,color:C.white,valign:"bottom"}),
    T(128,340,1060,56,deckCfg.audience||("共 "+active.length+" 個專案進行中"),{size:28,color:"#D8EAE4"}),
    T(128,600,800,36,(+Y)+" 年 "+(+M)+" 月 "+(+D)+" 日",{size:20,color:"#D8EAE4"})
  ]});

  // 2 overview
  const kp=[[active.length,"進行中專案"],[live.length,"已上線"],[totalSaved,"每月節省小時"],[totalUsage,"每月使用次數"]];
  const s2=[titleOf("總覽")];
  kp.forEach((k,i)=>{ const x=64+i*292; s2.push(R(x,160,276,220,{fill:C.soft}),T(x,184,276,110,k[0],{size:72,bold:true,color:C.accent,align:"center",valign:"middle"}),T(x,300,276,44,k[1],{size:22,align:"center",valign:"middle"})); });
  const flagged=all.filter(p=>isOver(p)||isStale(p)).length;
  s2.push(T(64,430,1152,150,"目前共 "+active.length+" 個專案在推進，其中 "+live.length+" 個已上線，合計每月節省約 "+totalSaved+" 小時。"+(flagged?"有 "+flagged+" 個專案超過時間盒或停滯，需要決定下一步。":"所有專案都在時程內。"),{size:26}));
  slides.push({name:"總覽",shapes:s2});

  // 3 pipeline
  const s3=[titleOf("專案在哪一關")];
  STAGES.forEach((s,i)=>{
    const x=64+i*166, ps=active.filter(p=>p.stage===s.k);
    s3.push(R(x,140,156,104,{fill:RAMP[i]}),
      T(x,146,156,58,ps.length,{size:40,bold:true,color:rampInk(i),align:"center",valign:"middle"}),
      T(x,204,156,34,(i+1)+" "+s.s,{size:18,color:rampInk(i),align:"center",valign:"middle"}));
    const names=ps.slice(0,8).map(p=>cut(nm(p),9));
    if(ps.length>8) names.push("另 "+(ps.length-8)+" 項");
    s3.push(T(x+4,260,152,400,names.length?names.join("\n"):"—",{size:16,color:names.length?C.ink:C.muted}));
  });
  slides.push({name:"專案管線",shapes:s3});

  // 4 timeline
  if(active.length){
    const now=new Date();
    const from=dnum(ymd(new Date(now.getFullYear(),now.getMonth()-1,1)));
    const to=dnum(ymd(new Date(now.getFullYear(),now.getMonth()+3,0)));
    const TX=344, TW=872, ppd=TW/(to-from+1);
    const X=d=>TX+(Math.max(from,Math.min(to+1,d))-from)*ppd;
    const rows=active.slice(0,10), top=150, rh=44, bottom=top+40+rows.length*rh;
    const s4=[titleOf("時程")];
    for(let d=new Date(now.getFullYear(),now.getMonth()-1,1); dnum(ymd(d))<=to; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
      const x=X(dnum(ymd(d)));
      s4.push(Ln(x,top,0,bottom-top),T(x+6,top,140,28,(d.getMonth()+1)+" 月",{size:14,color:C.muted}));
    }
    rows.forEach((p,r)=>{
      const y=top+40+r*rh;
      s4.push(Ln(64,y+rh,1152,0));
      s4.push(T(64,y+4,268,rh-8,cut(nm(p),14),{size:16,valign:"middle"}));
      ganttSegments(p,t).forEach(g=>{
        const x1=X(g.s), w=X(g.e)-x1; if(w<=0.5) return;
        if(g.k==="plan") s4.push(R(x1,y+11,w,22,{line:C.accent,dash:true,lineW:1.5}));
        else { const si=+g.k.slice(1)-1; s4.push(R(x1,y+11,w,22,{fill:g.k==="over"?C.warn:g.k==="parked"?C.line:RAMP[si]})); 
          if(w>56&&g.label) s4.push(T(x1+4,y+11,w-8,22,g.label,{size:12,valign:"middle",color:g.k==="over"?C.white:g.k==="parked"?C.muted:rampInk(si)})); }
      });
      if(p.due){ const d=dnum(p.due); if(d>=from&&d<=to) s4.push(R(X(d)+ppd/2-6,y+16,12,12,{fill:C.ink,rot:45})); }
    });
    if(t>=from&&t<=to) s4.push(Ln(X(t)+ppd/2,top,0,bottom-top,{color:C.danger,width:2}));
    const ly=Math.min(bottom+18,630);

/* ================= deck: HTML renderer ================= */
function shapeHTML(s){
  const box="left:"+s.x+"px;top:"+s.y+"px;width:"+s.w+"px;height:"+s.h+"px;";
  if(s.t==="rect"||s.t==="ellipse"){
    return '<div style="position:absolute;'+box+'background:'+(s.fill||"transparent")+';'+(s.line?'border:'+(s.lineW||1)+'px '+(s.dash?"dashed":"solid")+' '+s.line+';':'')+'box-sizing:border-box;'+(s.t==="ellipse"?"border-radius:50%;":"")+(s.rot?"transform:rotate("+s.rot+"deg);":"")+'"></div>';
  }
  if(s.t==="line"){
    return '<div style="position:absolute;left:'+s.x+'px;top:'+s.y+'px;width:'+(s.w||0)+'px;height:'+(s.h||0)+'px;'+(s.w?'border-top':'border-left')+':'+s.width+'px solid '+s.color+'"></div>';
  }
  if(s.t==="text"){
    const jc=s.valign==="middle"?"center":s.valign==="bottom"?"flex-end":"flex-start";
    return '<div class="tx" style="'+box+'justify-content:'+jc+';font-size:'+s.size+'px;color:'+s.color+';text-align:'+s.align+';font-weight:'+(s.bold?700:400)+'"><div>'+esc(s.text)+'</div></div>';
  }
  if(s.t==="table"){
    const cell=(v,j,tag,bold)=>'<'+tag+' style="height:'+s.rowH+'px;text-align:'+s.align[j]+';'+(tag==="th"?"background:"+C.soft+";color:"+C.ink+";font-weight:700;":"")+(bold?"font-weight:700;":"")+'">'+esc(v)+'</'+tag+'>';
    return '<table style="left:'+s.x+'px;top:'+s.y+'px;width:'+s.w+'px;font-size:'+s.size+'px"><colgroup>'+s.colW.map(w=>'<col style="width:'+w+'px">').join("")+'</colgroup>'+
      '<tr>'+s.head.map((h,j)=>cell(h,j,"th")).join("")+'</tr>'+
      s.rows.map((r,ri)=>'<tr>'+r.map((v,j)=>cell(v,j,"td",s.boldLast&&ri===s.rows.length-1)).join("")+'</tr>').join("")+'</table>';
  }
  return "";
}
function slideHTML(sl){ return '<div class="slide">'+sl.shapes.map(shapeHTML).join("")+'</div>'; }

/* ================= deck: PPTX ================= */
let pptxLoading=null;
function loadPptx(){
  if(window.PptxGenJS) return Promise.resolve();
  if(pptxLoading) return pptxLoading;
  pptxLoading=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"; s.onload=res; s.onerror=()=>{ pptxLoading=null; rej(); }; document.head.appendChild(s); });
  return pptxLoading;
}
async function downloadPptx(){
  notice("正在產生 PowerPoint…");
  try{ await loadPptx(); }catch(e){ notice("無法載入產生 PowerPoint 的元件，請確認網路連線後再試。","err"); return; }
  const slides=buildDeck();
  const pptx=new window.PptxGenJS(); pptx.layout="LAYOUT_WIDE"; pptx.title=deckCfg.title||"AI 導入進度報告";
  const IN=v=>v/96, PT=v=>Math.round(v*0.75*10)/10, HX=c=>(c||"").replace("#","");
  const FONT="Microsoft JhengHei";
  slides.forEach(sl=>{
    const s=pptx.addSlide(); s.background={color:"FFFFFF"};
    sl.shapes.forEach(o=>{
      if(o.t==="rect"||o.t==="ellipse"){
        s.addShape(o.t==="rect"?pptx.ShapeType.rect:pptx.ShapeType.ellipse,{x:IN(o.x),y:IN(o.y),w:IN(o.w),h:IN(o.h),rotate:o.rot||0,
          fill:o.fill?{color:HX(o.fill)}:{color:"FFFFFF",transparency:100},
          line:o.line?{color:HX(o.line),width:o.lineW||1,dashType:o.dash?"dash":"solid"}:{type:"none"}});
      } else if(o.t==="line"){
        s.addShape(pptx.ShapeType.line,{x:IN(o.x),y:IN(o.y),w:IN(o.w||0),h:IN(o.h||0),line:{color:HX(o.color),width:o.width}});
      } else if(o.t==="text"){
        s.addText(o.text,{x:IN(o.x),y:IN(o.y),w:IN(o.w),h:IN(o.h),fontFace:FONT,fontSize:PT(o.size),color:HX(o.color),bold:!!o.bold,align:o.align,valign:o.valign,margin:0,lineSpacingMultiple:1.15});
      } else if(o.t==="table"){
        const head=o.head.map((h,j)=>({text:String(h),options:{bold:true,fill:{color:HX(C.soft)},align:o.align[j]}}));
        const rows=o.rows.map((r,ri)=>r.map((v,j)=>({text:String(v),options:{align:o.align[j],bold:!!(o.boldLast&&ri===o.rows.length-1)}})));
        s.addTable([head].concat(rows),{x:IN(o.x),y:IN(o.y),w:IN(o.w),colW:o.colW.map(IN),rowH:IN(o.rowH),fontFace:FONT,fontSize:PT(o.size),color:HX(C.ink),valign:"middle",border:{type:"solid",pt:0.75,color:HX(C.line)},margin:[0,0.1,0,0.1]});
      }
    });
  });
  try{
    const blob=await pptx.write({outputType:"blob"});
    await saveFile((deckCfg.title||"AI導入進度報告")+"-"+today()+".pptx",blob);
    $("#notices").innerHTML="";
  }catch(e){ notice("產生 PowerPoint 時發生錯誤，請再試一次。","err"); }
}

async function restoreBackup(file){
  if(!file||!canEdit) return;
  let data;
  try{ const text=await (file.text?file.text():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file);})); data=JSON.parse(text); }
  catch(e){ notice("讀不到這個檔案。請選擇用「匯出備份」存下的 .json 檔。","err"); return; }
  if(!data||!Array.isArray(data.projects)){ notice("這個檔案不是專案備份。請選擇用「匯出備份」存下的 .json 檔。","err"); return; }
  let added=0, replaced=0; const batch=[];
  data.projects.forEach(raw=>{
    if(!raw||typeof raw!=="object") return;
    const p={}; FIELDS.forEach(f=>{ if(!empty(raw[f.k])) p[f.k]=raw[f.k]; });
    p.stage=ALL_STAGES.includes(p.stage)?p.stage:STAGES[0].k;
    p.decisions=Array.isArray(p.decisions)?p.decisions.filter(e=>e&&typeof e.t==="string").map(e=>({d:String(e.d||""),t:e.t})):[];
    p.createdAt=raw.createdAt||new Date().toISOString(); p.updatedAt=raw.updatedAt||p.createdAt;
    const id=typeof raw.id==="string"&&/^[A-Za-z0-9_\-]{1,100}$/.test(raw.id)?raw.id:newId();
    p.id=id; projects.has(id)?replaced++:added++;
    projects.set(id,p); batch.push(p);
  });
  const bx={items:[],sprints:[]};
  ["items","sprints"].forEach(c=>{ (Array.isArray(data[c])?data[c]:[]).forEach(raw=>{
    if(!raw||typeof raw!=="object") return;
    const o=cleanX(c,raw); o.id=typeof raw.id==="string"&&/^[A-Za-z0-9_\-]{1,100}$/.test(raw.id)?raw.id:newIdX(c);
    MAPX(c).set(o.id,o); bx[c].push(o); }); });
  if(data.settings){ applySettings(data.settings); saveSettings(); }
  if(data.deck&&typeof data.deck==="object"){ ["title","audience","detail","asks"].forEach(k=>{ if(typeof data.deck[k]==="string") deckCfg[k]=data.deck[k]; }); saveDeckCfg(); }
  renderAll(); notice("還原中…");
  if(mode==="db"||mode==="api"){ for(const p of batch){ await writeNow(p); } for(const c of ["items","sprints"]) for(const o of bx[c]) await writeX(c,o); }
  else { saveLocal(); lsSet(LSX.items,allX("items")); lsSet(LSX.sprints,allX("sprints")); }
  notice("還原完成：專案新增 "+added+" 筆、覆蓋 "+replaced+" 筆；工作項目 "+bx.items.length+" 筆；衝刺 "+bx.sprints.length+" 筆。");
}
async function saveFile(name,data){
  if(downloadsNS){
    try{ await downloadsNS.save({filename:name,data}); return; }
    catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited"){ notice("已有一個下載確認視窗開著，請先處理它。"); return; } }
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ notice("這個環境無法下載檔案。","err"); }
}
async function copyText(ta){
  try{ await navigator.clipboard.writeText(ta.value); notice("已複製。"); }
  catch(e){ ta.focus(); ta.select(); notice("請按 Ctrl+C（Mac 為 ⌘+C）複製已選取的文字。"); }
}

/* ================= boot ================= */
renderAll();
(async function boot(){
  const Cl=window.claude;
  let dbNS=null, userNS=null;
  if(Cl&&typeof Cl.use==="function"){
    try{ [dbNS,userNS,downloadsNS]=await Promise.all([Cl.use("db"),Cl.use("user"),Cl.use("downloads")]); }catch(e){}
  }
  if(userNS){ try{ canEdit=await userNS.canEdit(); }catch(e){} }
  if(dbNS){
    db=dbNS; col=db.collection("projects"); mode="db";
    ["items","sprints"].forEach(c=>{ COLX[c]=db.collection(c);
      COLX[c].onSnapshot(snap=>{
        const next=new Map(), cur=MAPX(c);
        snap.docs.forEach(d=>{ const local=cur.get(d.id); next.set(d.id,timers[c+":"+d.id]&&local?local:Object.assign({id:d.id},d.data())); });
        cur.forEach((o,id)=>{ if(!next.has(id)&&timers[c+":"+id]) next.set(id,o); });
        if(c==="items") items=next; else sprints=next;
        if(!loaded) return;
        const typing=document.querySelector("#main input:focus,#main textarea:focus");
        if(!typing) renderShell(); else { renderSub(); renderRail(); }
        if(openItem&&!items.has(openItem)){ openItem=null; renderDrawer(); }
        else if((openItem||openId)&&!document.querySelector(".drawer :focus")) renderDrawer();
      },()=>{});
    });
    db.doc("settings/timebox").onSnapshot(s=>{ if(s.exists){ applySettings(s.data()); if(loaded&&view!=="deck") renderShell(); } },()=>{});
    db.doc("settings/deck").get().then(s=>{ if(s.exists){ Object.assign(deckCfg,s.data()); if(loaded&&view==="deck") renderDeck(); } }).catch(()=>{});
    col.onSnapshot(snap=>{
      const next=new Map();
      snap.docs.forEach(d=>{ const local=projects.get(d.id); next.set(d.id,timers[d.id]&&local?local:Object.assign({id:d.id},d.data())); });
      projects.forEach((p,id)=>{ if(!next.has(id)&&timers[id]) next.set(id,p); });
      projects=next; loaded=true;
      if(document.querySelector("#main input:focus,#main textarea:focus")){ renderSub(); renderRail(); } else renderShell();
      if(openId&&!projects.has(openId)){ openId=null; renderDrawer(); }
      else if(openId&&!document.querySelector(".drawer :focus")) renderDrawer();
    },err=>{ loaded=true; renderShell(); notice("同步中斷（"+(err&&err.code||"未知")+"）。請重新整理頁面。","err"); });
  } else {
    let api=null, apiDenied=false;
    if(/^https?:$/.test(location.protocol)){
      try{
        const r=await fetch("/api/data",{cache:"no-store",credentials:"same-origin",headers:{accept:"application/json"}});
        const json=(r.headers.get("content-type")||"").includes("application/json");
        if(r.ok&&json) api=await r.json(); else if((r.status===401||r.status===403)&&json) apiDenied=true;
      }catch(e){}
    }
    if(api||apiDenied){
      mode="api";
      if(api){ mergeApi(api); }
      else { canEdit=false; notice("伺服器拒絕讀取資料：Cloudflare Access 尚未設定完成，或登入已過期。請依 README 的步驟設定後重新整理。","err"); }
      loaded=true; renderAll();
      if(api){ apiTimer=setInterval(apiPull,30000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) apiPull(); }); }
      return;
    }
    mode="local";
    const a=lsGet(LS_KEY); projects=new Map((Array.isArray(a)?a:[]).map(p=>[p.id,p]));
    applySettings(lsGet(LS_SET)); const dc=lsGet(LS_DECK); if(dc) Object.assign(deckCfg,dc);
    ["items","sprints"].forEach(c=>{ const a=lsGet(LSX[c]); const m=new Map((Array.isArray(a)?a:[]).map(o=>[o.id,o])); if(c==="items") items=m; else sprints=m; });
    loaded=true; renderAll();
  }
})();
})();
</script>
